# Build Windows automatique : à chaque tag vX.Y.Z, l'exécutable est compilé
# sur Windows puis publié dans les Releases du dépôt.
#
# Utilisation :
#     git tag v1.3.0 && git push origin v1.3.0
# → Actions : lint + tests + build PyInstaller + Release avec .zip téléchargeable.
# (« Actions → Build Windows → Run workflow » pour un build sans publication.)

name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          pip install pyinstaller ruff

      - name: Qualité avant build (lint + tests)
        run: |
          python -m ruff check .
          python tests/test_calculator.py

      - name: Vérifier la cohérence du tag (vX.Y.Z = APP_VERSION)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $out = (python scripts/dev.py version) | Select-Object -Last 1
          $v = $out -replace '.*v',''
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Le tag ${{ github.ref_name }} ne correspond pas à la version du code (v$v)"
            exit 1
          }

      - name: Construire l'exécutable (PyInstaller)
        run: python scripts/build_windows.py

      - name: Archive + empreinte SHA-256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VehicleCostCalculator `
            -DestinationPath "VehicleCostCalculator-${{ github.ref_name }}-win64.zip"
          $h = (Get-FileHash "VehicleCostCalculator-${{ github.ref_name }}-win64.zip" -Algorithm SHA256).Hash
          "$h  VehicleCostCalculator-${{ github.ref_name }}-win64.zip" |
            Out-File -Encoding ascii "VehicleCostCalculator-${{ github.ref_name }}-win64.zip.sha256"

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            VehicleCostCalculator-*-win64.zip
            VehicleCostCalculator-*-win64.zip.sha256
          body: |
            **Exécutable Windows autonome** — aucun Python à installer.

            1. Télécharger le .zip et l'empreinte `.sha256`
            2. Vérifier : `Get-FileHash VehicleCostCalculator-*-win64.zip` (doit correspondre au .sha256)
            3. Extraire puis lancer `VehicleCostCalculator.exe`

            Les données sont stockées dans `%APPDATA%\VehicleCostCalculator\`
            (sauvegarde automatique à chaque démarrage).
