# Configuration des outils de développement (aucun effet à l'exécution).
# Analyse statique :  pip install ruff  puis  ruff check .

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "C408",   # dict(...) explicite accepté dans les tests
    "RUF002", # typographie française intentionnelle dans les docstrings (×, «», …)
    "RUF003", # idem, dans les commentaires
]
